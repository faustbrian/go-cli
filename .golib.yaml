schema_version: 1
tool_version: v1.0.14
tool_checksums_sha256: 88341d2f2904925b22ec8de084fec68c5229669f1119f066ed5fccd76aee2f82
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: ".verification"
mutation:
  root: ".verification/mutation"
  imports:
  - module: "."
    archive: ".verification/mutation/bootstrap/root.zip"
    ledger: ".verification/mutation/migration-ledger.json"
api:
  baselines:
  - module: "."
    mode: apidiff
    path: api/baseline.txt
runtimes:
  zsh: "5.9"
operations:
- module: "."
  gate: test
  steps:
  - type: go-test
    packages: ["."]
    run: 'Concurrent|Parallel|Completion|Shutdown'
    count: 20
    timeout: 20m
- module: "."
  gate: docs
  steps:
  - type: make
    makefile: verification/package.mk
    target: docs
    timeout: 20m
- module: "."
  gate: fuzz
  steps:
  - type: go-test
    packages: ["."]
    fuzz: '^FuzzRunArgv$'
    budget: 2s
    timeout: 2m
  - type: go-test
    packages: ["."]
    fuzz: '^FuzzCompileCommandGraph$'
    budget: 2s
    timeout: 2m
  - type: go-test
    packages: ["."]
    fuzz: '^FuzzTypedConversion$'
    budget: 2s
    timeout: 2m
  - type: go-test
    packages: ["."]
    fuzz: '^FuzzCompletionPartialArgv$'
    budget: 2s
    timeout: 2m
  - type: go-test
    packages: ["."]
    fuzz: '^FuzzLifecycleFailureAndCancellation$'
    budget: 2s
    timeout: 2m
  - type: go-test
    packages: ["."]
    fuzz: '^FuzzHelpMarkdownAndManifestGeneration$'
    budget: 2s
    timeout: 2m
  - type: go-test
    packages: ["."]
    fuzz: '^FuzzJSONErrorAndSuccessRendering$'
    budget: 2s
    timeout: 2m
  - type: go-test
    packages: ["."]
    fuzz: '^FuzzHumanTerminalRendering$'
    budget: 2s
    timeout: 2m
  - type: go-test
    packages: ["./internal/engine"]
    fuzz: '^FuzzAdapterTranslation$'
    budget: 2s
    timeout: 2m
- module: "."
  gate: benchmark
  steps:
  - type: make
    makefile: verification/package.mk
    target: benchmark
    timeout: 20m
